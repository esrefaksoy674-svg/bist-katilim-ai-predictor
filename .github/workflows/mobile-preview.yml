name: Expo Mobile Preview

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-preview.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-preview.yml"
  workflow_dispatch:

jobs:
  expo-export:
    name: Bundle Android preview
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: mobile/package.json
      - run: npm install
      - run: npx expo export --platform android
