name: Daily Katilim Scan

on:
  schedule:
    - cron: "15 16 * * 1-5"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify comparison database configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::GitHub Actions secret DATABASE_URL is missing. The comparison API reads predictions from Render PostgreSQL, so the scan must use the same database."
            exit 1
          fi

      - name: Run daily scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.services.scheduled_scan
