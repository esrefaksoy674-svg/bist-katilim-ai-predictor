name: Old Version Android APK

on:
  push:
    branches:
      - versiyon-eski-karsilastirma
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout old comparison version
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease

      - name: Upload old-version APK
        uses: actions/upload-artifact@v4
        with:
          name: bist-katilim-ai-eski-surum-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

# Rebuild old comparison APK with the isolated package name.
