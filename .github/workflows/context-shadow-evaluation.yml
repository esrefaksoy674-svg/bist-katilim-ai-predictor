name: Weekly Context Shadow Evaluation

on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Evaluate context challenger
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -m app.services.context_shadow_evaluation | tee context-shadow-report.json
          {
            echo "## Context shadow evaluation"
            echo
            echo '```json'
            cat context-shadow-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
