name: Daily Katilim Scan
# Controlled one-time trigger: [run-daily-scan]

on:
  schedule:
    - cron: "15 16 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  scan:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[run-daily-scan]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m app.services.scheduled_scan
